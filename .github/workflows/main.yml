          import 'dart:convert';
          import 'dart:io';

          import 'package:dio/dio.dart';
          import 'package:flutter/foundation.dart';

          import '../../../core/models/chat_models.dart';
          import '../domain/ai_provider.dart';
          import '../domain/provider_types.dart';
          import 'sse_parser.dart';

          /// Google Gemini client with Live Screen Vision and Honest Degradation.
          class GeminiProvider implements AIProvider {
            GeminiProvider({
              required this.configId,
              required this.baseUrl,
              this.apiKey,
              Dio? dio,
            }) : _dio = dio ??
                      Dio(BaseOptions(
                        connectTimeout: const Duration(seconds: 20),
                        receiveTimeout: const Duration(minutes: 5),
                      ));

            static const String honestDegradationNote =
                '[vision unavailable: this endpoint rejected image content, so the screenshot was NOT delivered to you. '
                'Do not claim to see it; work from text, or tell the user this model cannot receive images.]';

            @override
            final String configId;
            final String baseUrl;
            final String? apiKey;
            final Dio _dio;

            @override
            String get displayName => ProviderType.gemini.displayName;

            @override
            bool get supportsTools => true;

            @override
            bool get supportsVision => true;

            Map<String, String> get _headers => {
                  if (apiKey != null && apiKey!.isNotEmpty) 'x-goog-api-key': apiKey!,
                  'Content-Type': 'application/json',
                };

            static List<int>? _extractVisionBytes(String content) {
              final m = RegExp(r'\[SCREEN_VISION_IMAGE:([^\]]+)\]').firstMatch(content);
              if (m == null) return null;
              final path = m.group(1)?.trim();
              if (path == null || path.isEmpty) return null;
              try {
                final f = File(path);
                if (f.existsSync()) return f.readAsBytesSync();
              } catch (_) {}
              return null;
            }

            static String _stripVisionTag(String content) {
              return content.replaceAll(RegExp(r'\[SCREEN_VISION_IMAGE:[^\]]+\]'), '').trim();
            }

            @override
            Stream<ChatStreamEvent> streamMessage(ChatRequest request) async* {
              final lastMsg = request.messages.isNotEmpty ? request.messages.last : null;
              final hasVisionImage =
                  lastMsg != null && _extractVisionBytes(lastMsg.content) != null;

              Map<String, dynamic> buildPayload({
                required bool includeVision,
                required bool appendDegradedNote,
              }) {
                final (system, contents) = convertMessages(
                  request.messages,
                  request.params.systemPrompt,
                  includeVision: includeVision,
                  appendDegradedNote: appendDegradedNote,
                );
                return <String, dynamic>{
                  'contents': contents,
                  if (system != null)
                    'systemInstruction': {
                      'parts': [
                        {'text': system},
                      ],
                    },
                  'generationConfig': {
                    'temperature': request.params.temperature,
                    'topP': request.params.topP,
                    'maxOutputTokens': request.params.maxTokens,
                  },
                  if (request.tools.isNotEmpty)
                    'tools': [
                      {'functionDeclarations': convertTools(request.tools)},
                    ],
                };
              }

              Response<ResponseBody>? response;
              try {
                final body = buildPayload(includeVision: true, appendDegradedNote: false);
                response = await _dio.post<ResponseBody>(
                  '$baseUrl/v1beta/models/${request.model}:streamGenerateContent?alt=sse',
                  data: jsonEncode(body),
                  options: Options(
                    headers: _headers,
                    responseType: ResponseType.stream,
                  ),
                  cancelToken: request.cancelToken,
                );
              } on DioException catch (e) {
                if (e.type == DioExceptionType.cancel) {
                  yield const StreamDoneEvent();
                  return;
                }
                final statusCode = e.response?.statusCode ?? 0;
                if (hasVisionImage && statusCode >= 400 && statusCode < 500) {
                  debugPrint('vision: degraded to text (endpoint rejected images)');
                  try {
                    final fallbackBody =
                        buildPayload(includeVision: false, appendDegradedNote: true);
                    response = await _dio.post<ResponseBody>(
                      '$baseUrl/v1beta/models/${request.model}:streamGenerateContent?alt=sse',
                      data: jsonEncode(fallbackBody),
                      options: Options(
                        headers: _headers,
                        responseType: ResponseType.stream,
                      ),
                      cancelToken: request.cancelToken,
                    );
                  } on DioException catch (retryErr) {
                    yield StreamErrorEvent(dioErrorMessage(retryErr));
                    return;
                  }
                } else {
                  yield StreamErrorEvent(dioErrorMessage(e));
                  return;
                }
              }

              final body1 = response?.data;
              if (body1 == null) {
                yield const StreamErrorEvent('Empty response body');
                return;
              }

              final toolCalls = <ToolCallInfo>[];

              await for (final json in parseSseJsonStream(body1.stream)) {
                final usage = json['usageMetadata'] as Map<String, dynamic>?;
                if (usage != null) {
                  yield UsageEvent(UsageInfo(
                    promptTokens: (usage['promptTokenCount'] as num?)?.toInt(),
                    completionTokens: (usage['candidatesTokenCount'] as num?)?.toInt(),
                  ));
                }

                final candidates = json['candidates'];
                if (candidates is! List || candidates.isEmpty) continue;
                final content =
                    (candidates.first as Map<String, dynamic>)['content'];
                final parts = (content as Map<String, dynamic>?)?['parts'];
                if (parts is! List) continue;

                for (final raw in parts) {
                  final part = raw as Map<String, dynamic>;
                  final text = part['text'];
                  if (text is String && text.isNotEmpty) {
                    yield TextDeltaEvent(text);
                  }
                  final fnCall = part['functionCall'] as Map<String, dynamic>?;
                  if (fnCall != null) {
                    toolCalls.add(ToolCallInfo(
                      id: 'gemini_${toolCalls.length}_${fnCall['name']}',
                      name: fnCall['name'] as String? ?? '',
                      argumentsJson: jsonEncode(fnCall['args'] ?? const {}),
                    ));
                  }
                }
              }

              if (toolCalls.isNotEmpty) yield ToolCallsEvent(toolCalls);
              yield const StreamDoneEvent();
            }

            static (String?, List<Map<String, dynamic>>) convertMessages(
              List<ChatMessage> messages,
              String? extraSystemPrompt, {
              bool includeVision = true,
              bool appendDegradedNote = false,
            }) {
              final systemParts = <String>[
                if (extraSystemPrompt != null && extraSystemPrompt.isNotEmpty)
                  extraSystemPrompt,
                for (final m in messages)
                  if (m.role == MessageRole.system && m.content.isNotEmpty) m.content,
              ];

              final out = <Map<String, dynamic>>[];
              for (var i = 0; i < messages.length; i++) {
                final m = messages[i];
                final isLast = i == messages.length - 1;
                final visionBytes =
                    (isLast && includeVision) ? _extractVisionBytes(m.content) : null;
                var textContent = _stripVisionTag(m.content);
                if (isLast && appendDegradedNote) {
                  textContent = '$textContent\n$honestDegradationNote'.trim();
                }

                switch (m.role) {
                  case MessageRole.system:
                    break;
                  case MessageRole.user:
                    out.add({
                      'role': 'user',
                      'parts': [
                        if (visionBytes != null)
                          {
                            'inlineData': {
                              'mimeType': 'image/jpeg',
                              'data': base64Encode(visionBytes),
                            },
                          },
                        {'text': textContent},
                      ],
                    });
                  case MessageRole.assistant:
                    out.add({
                      'role': 'model',
                      'parts': [
                        if (textContent.isNotEmpty) {'text': textContent},
                        for (final call in m.toolCalls)
                          {
                            'functionCall': {
                              'name': call.name,
                              'args': _tryDecodeJson(call.argumentsJson),
                            },
                          },
                      ],
                    });
                  case MessageRole.tool:
                    out.add({
                      'role': 'user',
                      'parts': [
                        {
                          'functionResponse': {
                            'name': m.toolName ?? '',
                            'response': {'result': textContent},
                          },
                        },
                        if (visionBytes != null)
                          {
                            'inlineData': {
                              'mimeType': 'image/jpeg',
                              'data': base64Encode(visionBytes),
                            },
                          },
                      ],
                    });
                }
              }
              return (systemParts.isEmpty ? null : systemParts.join('\n\n'), out);
            }

            static Object _tryDecodeJson(String json) {
              try {
                return jsonDecode(json);
              } on FormatException {
                return <String, dynamic>{};
              }
            }

            static List<Map<String, dynamic>> convertTools(
              List<ProviderToolSpec> tools,
            ) {
              return [
                for (final tool in tools)
                  {
                    'name': tool.name,
                    'description': tool.description,
                    'parameters': tool.parameters,
                  },
              ];
            }

            @override
            Future<List<String>> listModels() async {
              try {
                final response = await _dio.get<Map<String, dynamic>>(
                  '$baseUrl/v1beta/models',
                  options: Options(headers: _headers),
                );
                final data = response.data?['models'];
                if (data is List) {
                  final models = data
                      .whereType<Map<String, dynamic>>()
                      .map((m) => (m['name'] as String? ?? '')
                          .replaceFirst('models/', ''))
                      .where((m) => m.isNotEmpty)
                      .toList();
                  if (models.isNotEmpty) return models;
                }
                return ProviderType.gemini.suggestedModels;
              } on DioException catch (e) {
                throw Exception(dioErrorMessage(e));
              }
            }
          }
