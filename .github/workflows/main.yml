                  case 'content_block_delta':
                    final delta = json['delta'] as Map<String, dynamic>?;
                    if (delta == null) break;
                    if (delta['type'] == 'text_delta') {
                      final text = delta['text'] as String?;
                      if (text != null && text.isNotEmpty) {
                        yield TextDeltaEvent(text);
                      }
                    } else if (delta['type'] == 'input_json_delta') {
                      final index = (json['index'] as num?)?.toInt() ?? 0;
                      final partial = delta['partial_json'] as String?;
                      if (partial != null) {
                        toolBuilders[index]?.jsonInput.write(partial);
                      }
                    }
                  case 'message_delta':
                    final usage = json['usage'] as Map<String, dynamic>?;
                    if (usage != null) {
                      outputTokens = (usage['output_tokens'] as num?)?.toInt();
                    }
                  case 'message_stop':
                    break;
                }
              }

              if (inputTokens != null || outputTokens != null) {
                yield UsageEvent(UsageInfo(
                  promptTokens: inputTokens,
                  completionTokens: outputTokens,
                ));
              }

              if (toolBuilders.isNotEmpty) {
                final calls = toolBuilders.entries
                    .where((e) => e.value.name.isNotEmpty)
                    .map((e) => ToolCallInfo(
                          id: e.value.id,
                          name: e.value.name,
                          argumentsJson: e.value.jsonInput.isEmpty
                              ? '{}'
                              : e.value.jsonInput.toString(),
                        ))
                    .toList();
                if (calls.isNotEmpty) yield ToolCallsEvent(calls);
              }
              yield const StreamDoneEvent();
            }

            static (String?, List<Map<String, dynamic>>) convertMessages(
              List<ChatMessage> messages,
              String? extraSystemPrompt, {
              bool includeVision = true,
              bool appendDegradedNote = false,
            }) {
              final systemParts = <String>[
                if (extraSystemPrompt != null && extraSystemPrompt.isNotEmpty)
                  extraSystemPrompt,
                for (final m in messages)
                  if (m.role == MessageRole.system && m.content.isNotEmpty) m.content,
              ];

              final out = <Map<String, dynamic>>[];
              for (var i = 0; i < messages.length; i++) {
                final m = messages[i];
                final isLast = i == messages.length - 1;
                final visionBytes =
                    (isLast && includeVision) ? _extractVisionBytes(m.content) : null;
                var textContent = _stripVisionTag(m.content);
                if (isLast && appendDegradedNote) {
                  textContent = '$textContent\n$honestDegradationNote'.trim();
                }

                switch (m.role) {
                  case MessageRole.system:
                    break;
                  case MessageRole.user:
                    if (visionBytes != null) {
                      out.add({
                        'role': 'user',
                        'content': [
                          {
                            'type': 'image',
                            'source': {
                              'type': 'base64',
                              'media_type': 'image/jpeg',
                              'data': base64Encode(visionBytes),
                            },
                          },
                          {'type': 'text', 'text': textContent},
                        ],
                      });
                    } else {
                      out.add({'role': 'user', 'content': textContent});
                    }
                  case MessageRole.assistant:
                    out.add({
                      'role': 'assistant',
                      'content': [
                        if (textContent.isNotEmpty) {'type': 'text', 'text': textContent},
                        for (final call in m.toolCalls)
                          {
                            'type': 'tool_use',
                            'id': call.id,
                            'name': call.name,
                            'input': _tryDecodeJson(call.argumentsJson),
                          },
                      ],
                    });
                  case MessageRole.tool:
                    out.add({
                      'role': 'user',
                      'content': [
                        {
                          'type': 'tool_result',
                          'tool_use_id': m.toolCallId,
                          'content': [
                            if (visionBytes != null)
                              {
                                'type': 'image',
                                'source': {
                                  'type': 'base64',
                                  'media_type': 'image/jpeg',
                                  'data': base64Encode(visionBytes),
                                },
                              },
                            {'type': 'text', 'text': textContent},
                          ],
                        },
                      ],
                    });
                }
              }
              return (systemParts.isEmpty ? null : systemParts.join('\n\n'), out);
            }

            static Object _tryDecodeJson(String json) {
