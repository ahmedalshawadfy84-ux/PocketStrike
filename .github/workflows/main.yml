name: Build PocketStrike Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Compile Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses & Install Build Tools
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" || true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Auto-Apply Clean Automation Files & Fix SDK Version
        run: |
          # 0. If files are nested inside PocketStrike-main/, move them to repo root
          if [ ! -f pubspec.yaml ] && [ -f PocketStrike-main/pubspec.yaml ]; then
            shopt -s dotglob
            mv PocketStrike-main/* .
            rmdir PocketStrike-main || true
          fi

          # 1. Fix pubspec.yaml: ensure flutter and flutter_test keep 'sdk: flutter', and environment uses '>=3.5.0 <4.0.0'
          sed -i '/environment:/,+1 s/sdk:.*/sdk: ">=3.5.0 <4.0.0"/' pubspec.yaml
          sed -i '/flutter:/,+1 s/sdk:.*/sdk: flutter/' pubspec.yaml
          sed -i '/flutter_test:/,+1 s/sdk:.*/sdk: flutter/' pubspec.yaml

          # 2. Replace experimental null-aware map element (?system) in anthropic_provider.dart
          if [ -f lib/features/providers/data/anthropic_provider.dart ]; then
            sed -i "s/'system': ?system,/if (system != null) 'system': system,/g" lib/features/providers/data/anthropic_provider.dart
          fi

          # 3. Ensure compileSdk and Gradle memory are safe on GitHub Actions
          if [ -f android/app/build.gradle.kts ]; then
            if ! "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list_installed | grep -q "platforms;android-37"; then
              sed -i 's/compileSdk = 37/compileSdk = 36/g' android/app/build.gradle.kts
            fi
          fi
          if [ -f android/gradle.properties ]; then
            sed -i 's/-Xmx8G -XX:MaxMetaspaceSize=4G/-Xmx4G -XX:MaxMetaspaceSize=2G/g' android/gradle.properties
          fi

          # 4. Strip any accidental markdown code fences (```) across all Dart, Kotlin, and XML files
          find lib android -type f \( -name "*.dart" -o -name "*.kt" -o -name "*.xml" \) -exec sed -i '/^[[:space:]]*```/d' {} +

          # 5. Clean chat_controller.dart and enable Local agent tools
          if [ -f lib/features/chat/application/chat_controller.dart ]; then
            sed -i 's/if (state\.agentMode || state\.localMode) {{/if (state.agentMode || state.localMode) {/g' lib/features/chat/application/chat_controller.dart
            sed -i 's/if (state\.agentMode) {/if (state.agentMode || state.localMode) {/g' lib/features/chat/application/chat_controller.dart
          fi

          # 6. Write clean accessibility_service_config.xml
          mkdir -p android/app/src/main/res/xml
          cat << 'EOF_ACC_XML' > android/app/src/main/res/xml/accessibility_service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagRetrieveInteractiveWindows|flagIncludeNotImportantViews|flagReportViewIds"
              android:canPerformGestures="true"
              android:canRetrieveWindowContent="true"
              android:notificationTimeout="100" />
          EOF_ACC_XML

          # 7. Write clean PocketStrikeAccessibilityService.kt
          mkdir -p android/app/src/main/kotlin/com/pocketstrike/pocketstrike
          cat << 'EOF_ACC_KT' > android/app/src/main/kotlin/com/pocketstrike/pocketstrike/PocketStrikeAccessibilityService.kt
          package com.pocketstrike.pocketstrike

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.graphics.Path
          import android.graphics.Rect
          import android.os.Build
          import android.os.Bundle
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import java.util.concurrent.CountDownLatch
          import java.util.concurrent.TimeUnit

          class PocketStrikeAccessibilityService : AccessibilityService() {

              companion object {
                  @Volatile
                  var instance: PocketStrikeAccessibilityService? = null
                      private set
              }

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  instance = this
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  // Inspected on-demand via rootInActiveWindow
              }

              override fun onInterrupt() {}

              override fun onDestroy() {
                  if (instance === this) {
                      instance = null
                  }
                  super.onDestroy()
              }

              fun dumpUiHierarchy(maxNodes: Int = 80): String {
                  val root = rootInActiveWindow
                      ?: return "Error: No active window available. Make sure the screen is unlocked."
                  val sb = StringBuilder()
                  sb.appendLine("Active Package: ${root.packageName ?: "unknown"}")
                  var count = 0

                  fun traverse(node: AccessibilityNodeInfo?, depth: Int) {
                      if (node == null || count >= maxNodes) return
                      val text = node.text?.toString()?.trim().orEmpty()
                      val desc = node.contentDescription?.toString()?.trim().orEmpty()
                      val viewId = node.viewIdResourceName?.substringAfter("/") ?: ""
                      val isClickable = node.isClickable
                      val isEditable = node.isEditable
                      val isScrollable = node.isScrollable

                      if (text.isNotEmpty() || desc.isNotEmpty() || isClickable || isEditable) {
                          val rect = Rect()
                          node.getBoundsInScreen(rect)
                          if (rect.width() > 0 && rect.height() > 0) {
                              count++
                              val cx = rect.centerX()
                              val cy = rect.centerY()
                              val flags = mutableListOf<String>()
                              if (isClickable) flags.add("clickable")
                              if (isEditable) flags.add("editable")
                              if (isScrollable) flags.add("scrollable")
                              val cls = node.className?.toString()?.substringAfterLast('.') ?: "View"
                              sb.appendLine(
                                  "[$count] $cls | text='$text' | desc='$desc' | id='$viewId' | center=($cx,$cy) | flags=${flags.joinToString(",")}"
                              )
                          }
                      }

                      for (i in 0 until node.childCount) {
                          traverse(node.getChild(i), depth + 1)
                      }
                  }

                  traverse(root, 0)
                  return if (count == 0) {
                      "No interactive UI elements found in active window (${root.packageName})."
                  } else {
                      sb.toString().trim()
                  }
              }

              fun clickByText(query: String): Boolean {
                  val root = rootInActiveWindow ?: return false
                  val normalized = query.trim().lowercase()
                  val match = findNodeMatching(root) { node ->
                      val t = node.text?.toString()?.lowercase().orEmpty()
                      val d = node.contentDescription?.toString()?.lowercase().orEmpty()
                      val id = node.viewIdResourceName?.lowercase().orEmpty()
                      t.contains(normalized) || d.contains(normalized) || id.contains(normalized)
                  } ?: return false

                  var current: AccessibilityNodeInfo? = match
                  while (current != null) {
                      if (current.isClickable && current.performAction(AccessibilityNodeInfo.ACTION_CLICK)) {
                          return true
                      }
                      current = current.parent
                  }

                  val rect = Rect()
                  match.getBoundsInScreen(rect)
                  if (rect.width() > 0 && rect.height() > 0) {
                      return tapCoordinates(rect.centerX().toFloat(), rect.centerY().toFloat())
                  }
                  return false
              }

              fun inputText(text: String, targetQuery: String? = null, submit: Boolean = false): Boolean {
                  val root = rootInActiveWindow ?: return false
                  var targetNode: AccessibilityNodeInfo? = null

                  if (!targetQuery.isNullOrBlank()) {
                      val q = targetQuery.trim().lowercase()
                      targetNode = findNodeMatching(root) { node ->
                          val t = node.text?.toString()?.lowercase().orEmpty()
                          val d = node.contentDescription?.toString()?.lowercase().orEmpty()
                          val id = node.viewIdResourceName?.lowercase().orEmpty()
                          val hint = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                              node.hintText?.toString()?.lowercase().orEmpty()
                          } else ""
                          (node.isEditable || node.className?.toString()?.contains("EditText") == true) &&
                              (t.contains(q) || d.contains(q) || id.contains(q) || hint.contains(q))
                      }
                      if (targetNode == null) {
                          if (clickByText(targetQuery)) {
                              Thread.sleep(600)
                          }
                      }
                  }

                  val updatedRoot = rootInActiveWindow ?: root
                  if (targetNode == null) {
                      targetNode = updatedRoot.findFocus(AccessibilityNodeInfo.FOCUS_INPUT)
                  }
                  if (targetNode == null) {
                      targetNode = findNodeMatching(updatedRoot) { node ->
                          node.isEditable || node.className?.toString()?.contains("EditText") == true
                      }
                  }

                  val node = targetNode ?: return false
                  node.performAction(AccessibilityNodeInfo.ACTION_FOCUS)
                  node.performAction(AccessibilityNodeInfo.ACTION_CLICK)

                  val args = Bundle().apply {
                      putCharSequence(
                          AccessibilityNodeInfo.ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE,
                          text
                      )
                  }
                  val setOk = node.performAction(AccessibilityNodeInfo.ACTION_SET_TEXT, args)

                  if (submit) {
                      Thread.sleep(250)
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                          node.performAction(AccessibilityNodeInfo.AccessibilityAction.ACTION_IME_ENTER.id)
                      }
                  }
                  return setOk
              }

              fun tapCoordinates(x: Float, y: Float, durationMs: Long = 100L): Boolean {
                  val path = Path().apply { moveTo(x, y) }
                  val stroke = GestureDescription.StrokeDescription(path, 0L, durationMs)
                  val gesture = GestureDescription.Builder().addStroke(stroke).build()
                  return dispatchGestureSync(gesture)
              }

              fun swipe(
                  startX: Float,
                  startY: Float,
                  endX: Float,
                  endY: Float,
                  durationMs: Long = 350L
              ): Boolean {
                  val path = Path().apply {
                      moveTo(startX, startY)
                      lineTo(endX, endY)
                  }
                  val stroke = GestureDescription.StrokeDescription(path, 0L, durationMs.coerceIn(50L, 5000L))
                  val gesture = GestureDescription.Builder().addStroke(stroke).build()
                  return dispatchGestureSync(gesture)
              }

              fun performGlobal(actionName: String): Boolean {
                  val action = when (actionName.trim().lowercase()) {
                      "back" -> GLOBAL_ACTION_BACK
                      "home" -> GLOBAL_ACTION_HOME
                      "recents" -> GLOBAL_ACTION_RECENTS
                      "notifications" -> GLOBAL_ACTION_NOTIFICATIONS
                      "quick_settings" -> GLOBAL_ACTION_QUICK_SETTINGS
                      else -> return false
                  }
                  return performGlobalAction(action)
              }

              private fun dispatchGestureSync(gesture: GestureDescription): Boolean {
                  val latch = CountDownLatch(1)
                  var succeeded = false
                  val dispatched = dispatchGesture(
                      gesture,
                      object : GestureResultCallback() {
                          override fun onCompleted(gestureDescription: GestureDescription?) {
                              succeeded = true
                              latch.countDown()
                          }

                          override fun onCancelled(gestureDescription: GestureDescription?) {
                              succeeded = false
                              latch.countDown()
                          }
                      },
                      null
                  )
                  if (!dispatched) return false
                  latch.await(5, TimeUnit.SECONDS)
                  return succeeded
              }

              private fun findNodeMatching(
                  root: AccessibilityNodeInfo?,
                  predicate: (AccessibilityNodeInfo) -> Boolean
              ): AccessibilityNodeInfo? {
                  if (root == null) return null
                  if (predicate(root)) return root
                  for (i in 0 until root.childCount) {
                      val childMatch = findNodeMatching(root.getChild(i), predicate)
                      if (childMatch != null) return childMatch
                  }
                  return null
              }
          }
          EOF_ACC_KT

          # 8. Write clean MainActivity.kt
          cat << 'EOF_MAIN_KT' > android/app/src/main/kotlin/com/pocketstrike/pocketstrike/MainActivity.kt
          package com.pocketstrike.pocketstrike

          import android.app.SearchManager
          import android.content.ContentValues
          import android.content.Intent
          import android.media.MediaScannerConnection
          import android.net.Uri
          import android.os.Build
          import android.os.Environment
          import android.provider.MediaStore
          import android.provider.Settings
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import java.io.File
          import java.io.FileOutputStream
          import java.util.concurrent.Executors

          class MainActivity : FlutterActivity() {
              private val CHANNEL = "com.pocketstrike.app/gallery"
              private val AUTOMATION_CHANNEL = "com.pocketstrike/automation"
              private val automationExecutor = Executors.newSingleThreadExecutor()

              private val commonAppAliases = mapOf(
                  "youtube" to "com.google.android.youtube",
                  "يوتيوب" to "com.google.android.youtube",
                  "اليوتيوب" to "com.google.android.youtube",
                  "whatsapp" to "com.whatsapp",
                  "واتساب" to "com.whatsapp",
                  "الواتساب" to "com.whatsapp",
                  "chrome" to "com.android.chrome",
                  "كروم" to "com.android.chrome",
                  "telegram" to "org.telegram.messenger",
                  "تليجرام" to "org.telegram.messenger",
                  "تيليجرام" to "org.telegram.messenger",
                  "facebook" to "com.facebook.katana",
                  "فيسبوك" to "com.facebook.katana",
                  "instagram" to "com.instagram.android",
                  "انستقرام" to "com.instagram.android",
                  "انستغرام" to "com.instagram.android",
                  "settings" to "com.android.settings",
                  "الإعدادات" to "com.android.settings",
                  "الاعدادات" to "com.android.settings",
                  "الضبط" to "com.android.settings"
              )

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)

                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL).setMethodCallHandler { call, result ->
                      when (call.method) {
                          "saveImageToGallery" -> {
                              val bytes = call.argument<ByteArray>("bytes")
                              val fileName = call.argument<String>("fileName") ?: "PocketStrike_${System.currentTimeMillis()}.jpg"

                              if (bytes == null || bytes.isEmpty()) {
                                  result.error("INVALID_DATA", "Image bytes cannot be empty", null)
                                  return@setMethodCallHandler
                              }

                              try {
                                  val savedUri = saveImageToMediaStore(bytes, fileName)
                                  if (savedUri != null) {
                                      result.success(savedUri)
                                  } else {
                                      result.error("SAVE_FAILED", "Failed to save image to MediaStore", null)
                                  }
                              } catch (e: Exception) {
                                  result.error("EXCEPTION", e.localizedMessage ?: "Unknown error", null)
                              }
                          }
                          "shareImage" -> {
                              val filePath = call.argument<String>("filePath")
                              val text = call.argument<String>("text") ?: "Created with PocketStrike AI"
                              if (filePath != null) {
                                  try {
                                      val file = File(filePath)
                                      if (file.exists()) {
                                          val uri = androidx.core.content.FileProvider.getUriForFile(
                                              applicationContext,
                                              "${applicationContext.packageName}.fileprovider",
                                              file
                                          )
                                          val intent = Intent(Intent.ACTION_SEND).apply {
                                              type = "image/jpeg"
                                              putExtra(Intent.EXTRA_STREAM, uri)
                                              putExtra(Intent.EXTRA_TEXT, text)
                                              addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                                              addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                                          }
                                          val chooser = Intent.createChooser(intent, "Share AI Image via").apply {
                                              addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                                          }
                                          applicationContext.startActivity(chooser)
                                          result.success(true)
                                      } else {
                                          result.error("FILE_NOT_FOUND", "File does not exist: $filePath", null)
                                      }
                                  } catch (e: Exception) {
                                      result.error("EXCEPTION", e.localizedMessage ?: "Unknown error", null)
                                  }
                              } else {
                                  result.error("INVALID_PATH", "File path is null", null)
                              }
                          }
                          "deleteFromMediaStore" -> {
                              val filePath = call.argument<String>("filePath")
                              val fileName = call.argument<String>("fileName")
                              try {
                                  if (filePath != null) {
                                      val file = File(filePath)
                                      if (file.exists()) {
                                          file.delete()
                                      }
                                  }
                                  if (fileName != null) {
                                      val resolver = applicationContext.contentResolver
                                      val collection = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                                          MediaStore.Images.Media.getContentUri(MediaStore.VOLUME_EXTERNAL_PRIMARY)
                                      } else {
                                          MediaStore.Images.Media.EXTERNAL_CONTENT_URI
                                      }
                                      val where = "${MediaStore.Images.Media.DISPLAY_NAME} = ?"
                                      val args = arrayOf(fileName)
                                      resolver.delete(collection, where, args)
                                  }
                                  if (filePath != null) {
                                      MediaScannerConnection.scanFile(
                                          applicationContext,
                                          arrayOf(filePath),
                                          arrayOf("image/jpeg", "image/png"),
                                          null
                                      )
                                  }
                                  result.success(true)
                              } catch (e: Exception) {
                                  result.error("EXCEPTION", e.localizedMessage ?: "Unknown error", null)
                              }
                          }
                          "scanFilePath" -> {
                              val filePath = call.argument<String>("filePath")
                              if (filePath != null) {
                                  MediaScannerConnection.scanFile(
                                      applicationContext,
                                      arrayOf(filePath),
                                      arrayOf("image/jpeg", "image/png"),
                                      null
                                  )
                                  result.success(true)
                              } else {
                                  result.error("INVALID_PATH", "File path is null", null)
                              }
                          }
                          else -> {
                              result.notImplemented()
                          }
                      }
                  }

                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, AUTOMATION_CHANNEL)
                      .setMethodCallHandler { call, result ->
                          automationExecutor.execute {
                              try {
                                  val response: Any? = when (call.method) {
                                      "isAccessibilityEnabled" -> {
                                          PocketStrikeAccessibilityService.instance != null
                                      }
                                      "openAccessibilitySettings" -> {
                                          val intent = Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS).apply {
                                              addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                                          }
                                          startActivity(intent)
                                          "Opened Android Accessibility Settings."
                                      }
                                      "listInstalledApps" -> {
                                          listLaunchableApps()
                                      }
                                      "openApp" -> {
                                          val appNameOrPkg = call.argument<String>("app") ?: ""
                                          val searchQuery = call.argument<String>("searchQuery")
                                          launchApp(appNameOrPkg, searchQuery)
                                      }
                                      "dumpUi" -> {
                                          val svc = PocketStrikeAccessibilityService.instance
                                          svc?.dumpUiHierarchy()
                                              ?: "Error: Accessibility Service is not enabled. Enable PocketStrike in Settings > Accessibility."
                                      }
                                      "clickNode" -> {
                                          val target = call.argument<String>("target") ?: ""
                                          val svc = PocketStrikeAccessibilityService.instance
                                          if (svc == null) {
                                              "Error: Accessibility Service is not enabled."
                                          } else if (svc.clickByText(target)) {
                                              "Clicked element matching '$target'."
                                          } else {
                                              "Could not find or click element matching '$target'."
                                          }
                                      }
                                      "tap" -> {
                                          val x = (call.argument<Number>("x")?.toFloat()) ?: 0f
                                          val y = (call.argument<Number>("y")?.toFloat()) ?: 0f
                                          val svc = PocketStrikeAccessibilityService.instance
                                          if (svc == null) {
                                              "Error: Accessibility Service is not enabled."
                                          } else if (svc.tapCoordinates(x, y)) {
                                              "Tapped coordinates ($x, $y)."
                                          } else {
                                              "Failed to tap coordinates ($x, $y)."
                                          }
                                      }
                                      "inputText" -> {
                                          val text = call.argument<String>("text") ?: ""
                                          val target = call.argument<String>("target")
                                          val submit = call.argument<Boolean>("submit") ?: false
                                          val svc = PocketStrikeAccessibilityService.instance
                                          if (svc == null) {
                                              "Error: Accessibility Service is not enabled."
                                          } else if (svc.inputText(text, target, submit)) {
                                              val suffix = if (submit) " and submitted" else ""
                                              "Typed '$text'$suffix."
                                          } else {
                                              "Could not find an editable text field on screen."
                                          }
                                      }
                                      "swipe" -> {
                                          val startX = (call.argument<Number>("startX")?.toFloat()) ?: 500f
                                          val startY = (call.argument<Number>("startY")?.toFloat()) ?: 1500f
                                          val endX = (call.argument<Number>("endX")?.toFloat()) ?: 500f
                                          val endY = (call.argument<Number>("endY")?.toFloat()) ?: 400f
                                          val duration = (call.argument<Number>("durationMs")?.toLong()) ?: 350L
                                          val svc = PocketStrikeAccessibilityService.instance
                                          if (svc == null) {
                                              "Error: Accessibility Service is not enabled."
                                          } else if (svc.swipe(startX, startY, endX, endY, duration)) {
                                              "Swiped from ($startX, $startY) to ($endX, $endY)."
                                          } else {
                                              "Swipe gesture failed."
                                          }
                                      }
                                      "globalAction" -> {
                                          val action = call.argument<String>("action") ?: "back"
                                          val svc = PocketStrikeAccessibilityService.instance
                                          if (svc == null) {
                                              "Error: Accessibility Service is not enabled."
                                          } else if (svc.performGlobal(action)) {
                                              "Executed system action: $action"
                                          } else {
                                              "Failed to execute system action: $action"
                                          }
                                      }
                                      else -> {
                                          runOnUiThread { result.notImplemented() }
                                          return@execute
                                      }
                                  }
                                  runOnUiThread { result.success(response) }
                              } catch (e: Exception) {
                                  runOnUiThread {
                                      result.error("AUTOMATION_ERR", e.message ?: "Unknown error", null)
                                  }
                              }
                          }
                      }
              }

              private fun listLaunchableApps(): String {
                  val pm = applicationContext.packageManager
                  val mainIntent = Intent(Intent.ACTION_MAIN, null).apply {
                      addCategory(Intent.CATEGORY_LAUNCHER)
                  }
                  val resolveInfos = pm.queryIntentActivities(mainIntent, 0)
                  val apps = resolveInfos.mapNotNull { info ->
                      val pkg = info.activityInfo?.packageName ?: return@mapNotNull null
                      val label = info.loadLabel(pm)?.toString()?.trim().orEmpty()
                      "• $label ($pkg)"
                  }.distinct().sorted()
                  return if (apps.isEmpty()) {
                      "No launchable apps found."
                  } else {
                      "Installed Apps (${apps.size}):\n" + apps.joinToString("\n")
                  }
              }

              private fun launchApp(appNameOrPkg: String, searchQuery: String?): String {
                  val query = appNameOrPkg.trim()
                  if (query.isEmpty()) return "Error: App name or package cannot be empty."

                  val pm = applicationContext.packageManager
                  var targetPkg: String? = commonAppAliases[query.lowercase()]

                  if (targetPkg == null) {
                      val mainIntent = Intent(Intent.ACTION_MAIN, null).apply {
                          addCategory(Intent.CATEGORY_LAUNCHER)
                      }
                      val resolveInfos = pm.queryIntentActivities(mainIntent, 0)
                      for (info in resolveInfos) {
                          val pkg = info.activityInfo?.packageName ?: continue
                          val label = info.loadLabel(pm)?.toString()?.trim().orEmpty()
                          if (pkg.equals(query, ignoreCase = true) ||
                              label.equals(query, ignoreCase = true) ||
                              label.contains(query, ignoreCase = true)
                          ) {
                              targetPkg = pkg
                              break
                          }
                      }
                  }

                  val resolvedPkg = targetPkg ?: query

                  if (!searchQuery.isNullOrBlank()) {
                      try {
                          val searchIntent = Intent(Intent.ACTION_SEARCH).apply {
                              setPackage(resolvedPkg)
                              putExtra(SearchManager.QUERY, searchQuery)
                              putExtra("query", searchQuery)
                              addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP)
                          }
                          if (searchIntent.resolveActivity(pm) != null) {
                              startActivity(searchIntent)
                              Thread.sleep(1200)
                              return "Opened $resolvedPkg and executed search for '$searchQuery'."
                          }
                      } catch (_: Exception) {}
                  }

                  val launchIntent = pm.getLaunchIntentForPackage(resolvedPkg)
                  if (launchIntent != null) {
                      launchIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      startActivity(launchIntent)
                      Thread.sleep(1200)
                      return "Successfully launched app: $resolvedPkg"
                  }

                  return "Error: Could not find or launch app '$appNameOrPkg'."
              }

              private fun saveImageToMediaStore(bytes: ByteArray, fileName: String): String? {
                  val resolver = applicationContext.contentResolver
                  val contentValues = ContentValues().apply {
                      put(MediaStore.Images.Media.DISPLAY_NAME, fileName)
                      put(MediaStore.Images.Media.MIME_TYPE, "image/jpeg")
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          put(MediaStore.Images.Media.RELATIVE_PATH, Environment.DIRECTORY_PICTURES + "/PocketStrike")
                          put(MediaStore.Images.Media.IS_PENDING, 1)
                      }
                  }

                  val collection = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      MediaStore.Images.Media.getContentUri(MediaStore.VOLUME_EXTERNAL_PRIMARY)
                  } else {
                      MediaStore.Images.Media.EXTERNAL_CONTENT_URI
                  }

                  val imageUri: Uri? = resolver.insert(collection, contentValues)

                  if (imageUri != null) {
                      resolver.openOutputStream(imageUri)?.use { outputStream ->
                          outputStream.write(bytes)
                          outputStream.flush()
                      }

                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          contentValues.clear()
                          contentValues.put(MediaStore.Images.Media.IS_PENDING, 0)
                          resolver.update(imageUri, contentValues, null, null)
                      }

                      return imageUri.toString()
                  }

                  val picturesDir = File(Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_PICTURES), "PocketStrike")
                  if (!picturesDir.exists()) {
                      picturesDir.mkdirs()
                  }
                  val destFile = File(picturesDir, fileName)
                  FileOutputStream(destFile).use { fos ->
                      fos.write(bytes)
                      fos.flush()
                  }
                  MediaScannerConnection.scanFile(
                      applicationContext,
                      arrayOf(destFile.absolutePath),
                      arrayOf("image/jpeg"),
                      null
                  )
                  return destFile.absolutePath
              }
          }
          EOF_MAIN_KT

