            static AgentTool clickElement() => AgentTool(
                  name: 'click_element',
                  description:
                      'Clicks a UI element or button on the phone screen matching its visible text, content description, or view ID (e.g. "Search", "بحث", "Subscribe").',
                  inputSchema: const {
                    'type': 'object',
                    'properties': {
                      'target': {
                        'type': 'string',
                        'description':
                            'Visible text, description, or resource ID of the element to click.',
                      },
