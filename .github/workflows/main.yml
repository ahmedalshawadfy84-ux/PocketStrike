name: Build PocketStrike Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Compile Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses & Install Build Tools
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" || true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Auto-Apply Fast Human Eye Vision & Game Engine
        run: |
          if [ ! -f pubspec.yaml ] && [ -f PocketStrike-main/pubspec.yaml ]; then
            shopt -s dotglob
            mv PocketStrike-main/* .
            rmdir PocketStrike-main || true
          fi

          sed -i '/environment:/,+1 s/sdk:.*/sdk: ">=3.5.0 <4.0.0"/' pubspec.yaml
          sed -i '/flutter:/,+1 s/sdk:.*/sdk: flutter/' pubspec.yaml
          sed -i '/flutter_test:/,+1 s/sdk:.*/sdk: flutter/' pubspec.yaml

          if [ -f android/app/build.gradle.kts ]; then
            if ! "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list_installed | grep -q "platforms;android-37"; then
              sed -i 's/compileSdk = 37/compileSdk = 36/g' android/app/build.gradle.kts
            fi
          fi
          if [ -f android/gradle.properties ]; then
            sed -i 's/-Xmx8G -XX:MaxMetaspaceSize=4G/-Xmx4G -XX:MaxMetaspaceSize=2G/g' android/gradle.properties
          fi

          mkdir -p android/app/src/main/res/xml
          cat << 'EOF_ACC_XML' > android/app/src/main/res/xml/accessibility_service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagRetrieveInteractiveWindows|flagIncludeNotImportantViews|flagReportViewIds"
              android:canPerformGestures="true"
              android:canRetrieveWindowContent="true"
              android:canTakeScreenshot="true"
              android:notificationTimeout="50" />
          EOF_ACC_XML

          mkdir -p android/app/src/main/kotlin/com/pocketstrike/pocketstrike
          cat << 'EOF_ACC_KT' > android/app/src/main/kotlin/com/pocketstrike/pocketstrike/PocketStrikeAccessibilityService.kt
          package com.pocketstrike.pocketstrike

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.graphics.Bitmap
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.Path
          import android.graphics.Rect
          import android.os.Build
          import android.os.Bundle
          import android.util.Log
          import android.view.Display
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import org.json.JSONArray
          import java.io.ByteArrayOutputStream
          import java.io.File
          import java.io.FileOutputStream
          import java.security.MessageDigest
          import java.util.concurrent.CountDownLatch
          import java.util.concurrent.TimeUnit
          import kotlin.math.abs
          import kotlin.math.max
          import kotlin.math.min

          class PocketStrikeAccessibilityService : AccessibilityService() {

              companion object {
                  private const val TAG = "PocketStrikeVision"

                  @Volatile
                  var instance: PocketStrikeAccessibilityService? = null
                      private set
              }

                  @Volatile
              private var lastFrameHash: String = ""

              @Volatile
              private var lastRealWidth: Int = 1080

              @Volatile
              private var lastRealHeight: Int = 2400

              @Volatile
              private var lastCaptureTimeMs: Long = 0L

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  instance = this
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}

              override fun onInterrupt() {}

              override fun onDestroy() {
                  if (instance === this) {
                      instance = null
                  }
                  super.onDestroy()
              }

              fun resetVisionSession() {
                  lastFrameHash = ""
              }

              /**
               * Captures the live screen with the proven clean Calibrated (x, y) Coordinate Grid
               * so Vision models read exact car/button coordinates directly from the image on the 1st try.
               */
              fun captureScreenVision(): String {
                  var capturedBitmap = takeScreenshotWithRetry()
                  val dm = resources.displayMetrics
                  // Use exact hardware screenshot dimensions (1080x2400 on Samsung Galaxy M52 5G) so grid coordinates match dispatchGesture 1:1
                  val screenW = capturedBitmap?.width ?: dm.widthPixels
                  val screenH = capturedBitmap?.height ?: dm.heightPixels
                  lastRealWidth = screenW
                  lastRealHeight = screenH
                  val orientation = if (screenW > screenH) "Landscape (Game Mode)" else "Portrait"

                  val sb = StringBuilder()
                  val root = rootInActiveWindow
                  val activePkg = root?.packageName?.toString() ?: "unknown_or_fullscreen_game"

                  sb.appendLine("=== LIVE SCREEN VISION (${screenW}x${screenH} $orientation | App: $activePkg) ===")
                  sb.appendLine(
                      "COORDINATE GUIDE: Read real screen (x,y) pixel coordinates directly from the yellow grid labels drawn on the attached image."
                  )
                  sb.appendLine(
                      "SAFETY & STOP CHECK: (1) NEVER tap Top-Right/Top-Left HUD corners (y < ${(screenH * 0.16).toInt()}) where Settings/Pause gear icons live. " +
                          "(2) Check the current Level/screen state against the user's request: if the requested level or goal is already completed (e.g. user asked for Level 1 only and screen shows Victory or Level 2), STOP calling tools immediately and report completion!"
                  )

                  val bmp = capturedBitmap
                  if (bmp != null) {
                      try {
                          // 1. Downscale so longest side <= 1024px, JPEG quality 68
                          val maxDim = 1280
                          val scale = min(1.0f, maxDim.toFloat() / max(bmp.width, bmp.height).toFloat())
                          val targetW = max(1, (bmp.width * scale).toInt())
                          val targetH = max(1, (bmp.height * scale).toInt())
                          val scaled = Bitmap.createScaledBitmap(bmp, targetW, targetH, true)
                              .copy(Bitmap.Config.ARGB_8888, true)

                          // Check MD5 hash of clean frame to detect if last action failed to change screen
                          val cleanBaos = ByteArrayOutputStream()
                          scaled.compress(Bitmap.CompressFormat.JPEG, 65, cleanBaos)
                          val newHash = md5Hex(cleanBaos.toByteArray())
                          val wasUnchanged = (lastFrameHash.isNotEmpty() && newHash == lastFrameHash)
                          lastFrameHash = newHash

                          if (wasUnchanged) {
                              sb.appendLine(
                                  "⚠️ COGNITIVE FEEDBACK (NO SCREEN CHANGE DETECTED): The screen state did NOT change after your previous action! " +
                                      "This means the target you interacted with is currently blocked by an obstacle/rule, non-interactive, disabled, or requires a prerequisite step first. " +
                                      "Do NOT repeat the exact same action or coordinates — analyze the visual rules, obstacles, and active indicators on screen, then choose a valid alternative!"
                              )
                          }

                          // 2. Run On-Device Visual Radar (for text-only local models)
                          val radarReport = analyzeBitmapForGames(bmp, screenW, screenH)
                          sb.appendLine(radarReport)

                          // 3. Draw ONLY the clean calibrated (x,y) coordinate grid (no red boxes covering cars!)
                          drawCalibratedCoordinateGrid(scaled, screenW, screenH)

                          val outFile = File(applicationContext.cacheDir, "human_eye_latest.jpg")
                          FileOutputStream(outFile).use { fos ->
                              scaled.compress(Bitmap.CompressFormat.JPEG, 78, fos)
                              fos.flush()
                          }
                          scaled.recycle()
                          bmp.recycle()

                          Log.i(TAG, "vision: attached (${outFile.length()} bytes)")
                          sb.appendLine("[SCREEN_VISION_IMAGE:${outFile.absolutePath}]")
                      } catch (e: Exception) {
                          try {
                              bmp.recycle()
                          } catch (_: Exception) {}
                          Log.i(TAG, "vision: capture failed: ${e.message}")
                          sb.appendLine("Vision Frame Note: ${e.message}")
                      }
                  } else {
                      Log.i(TAG, "vision: capture failed: null bitmap")
                      sb.appendLine("[vision: capture failed — working from UI tree dump below]")
                  }

                  val uiHierarchy = dumpUiHierarchy(maxNodes = 35)
                  sb.appendLine("=== UI TREE DUMP (Exact coordinates when present) ===")
                  sb.appendLine(uiHierarchy)

                  return sb.toString().trim()
              }

              private fun takeScreenshotWithRetry(): Bitmap? {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.R) return null
                  val now = System.currentTimeMillis()
                  val elapsed = now - lastCaptureTimeMs
                  if (elapsed in 1..950) {
                      try {
                          Thread.sleep(950L - elapsed)
                      } catch (_: Exception) {}
                  }
                  var bmp = takeScreenshotOnce()
                  if (bmp == null) {
                      try {
                          Thread.sleep(1000L)
                      } catch (_: Exception) {}
                      bmp = takeScreenshotOnce()
                  }
                  return bmp
              }

              private fun takeScreenshotOnce(): Bitmap? {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.R) return null
                  val latch = CountDownLatch(1)
                  var captured: Bitmap? = null
                  try {
                      lastCaptureTimeMs = System.currentTimeMillis()
                      takeScreenshot(
                          Display.DEFAULT_DISPLAY,
                          mainExecutor,
                          object : TakeScreenshotCallback {
                              override fun onSuccess(screenshot: ScreenshotResult) {
                                  try {
                                      val hwBuffer = screenshot.hardwareBuffer
                                      val colorSpace = screenshot.colorSpace
                                      val hwBitmap = Bitmap.wrapHardwareBuffer(hwBuffer, colorSpace)
                                      if (hwBitmap != null) {
                                          captured = hwBitmap.copy(Bitmap.Config.ARGB_8888, true)
                                          hwBitmap.recycle()
                                      }
                                      hwBuffer.close()
                                  } catch (_: Exception) {
                                  } finally {
                                      latch.countDown()
                                  }
                              }

                              override fun onFailure(errorCode: Int) {
                                  latch.countDown()
                              }
                          }
                      )
                      latch.await(3500, TimeUnit.MILLISECONDS)
                  } catch (_: Exception) {}
                  return captured
              }

              private fun md5Hex(bytes: ByteArray): String {
                  val md = MessageDigest.getInstance("MD5")
                  val digest = md.digest(bytes)
                  val sb = StringBuilder(digest.size * 2)
                  for (b in digest) {
                      sb.append(String.format("%02x", b))
                  }
                  return sb.toString()
              }

              /**
               * Draws a clean 6x10 coordinate grid with real-screen (x, y) labels onto the screenshot
               * without obscuring game sprites or cars.
               */
              private fun drawCalibratedCoordinateGrid(bmp: Bitmap, realW: Int, realH: Int) {
                  val canvas = Canvas(bmp)
                  val w = bmp.width.toFloat()
                  val h = bmp.height.toFloat()
                  val cols = 7
                  val rows = 12

                  val linePaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      color = Color.argb(85, 0, 255, 255)
                      strokeWidth = 1.0f
                      style = Paint.Style.STROKE
                  }
                  val dotPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      color = Color.argb(220, 255, 255, 0)
                      style = Paint.Style.FILL
                  }
                  val bgPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      color = Color.argb(145, 0, 0, 0)
                      style = Paint.Style.FILL
                  }
                  val textPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      color = Color.rgb(255, 255, 100)
                      textSize = max(10f, min(w, h) * 0.019f)
                      isFakeBoldText = true
                  }

                  for (c in 1 until cols) {
                      val gx = (w * c) / cols
                      canvas.drawLine(gx, 0f, gx, h, linePaint)
                  }
                  for (r in 1 until rows) {
                      val gy = (h * r) / rows
                      canvas.drawLine(0f, gy, w, gy, linePaint)
                  }

                  for (r in 1 until rows) {
                      for (c in 1 until cols) {
                          val gx = (w * c) / cols
                          val gy = (h * r) / rows
                          val realX = (realW * c) / cols
                          val realY = (realH * r) / rows
                          val label = "$realX,$realY"

                          canvas.drawCircle(gx, gy, 3f, dotPaint)
                          val tw = textPaint.measureText(label)
                          val th = textPaint.textSize
                          canvas.drawRect(gx + 3f, gy - th, gx + tw + 7f, gy + 3f, bgPaint)
                          canvas.drawText(label, gx + 5f, gy - 1f, textPaint)
                      }
                  }
              }

              private fun analyzeBitmapForGames(bmp: Bitmap, screenW: Int, screenH: Int): String {
                  val cols = 8
                  val rows = 12
                  val bw = bmp.width
                  val bh = bmp.height

                  data class Hotspot(
                      val screenX: Int,
                      val screenY: Int,
                      val contrastScore: Double,
                      val colorLabel: String,
                      val zoneLabel: String
                  )

                  val hotspots = mutableListOf<Hotspot>()

                  for (r in 2 until (rows - 2)) { // Skip Top-HUD (r < 2) and Bottom Powerup bar (r >= rows - 2)
                      for (c in 0 until cols) {
                          val x0 = (c * bw) / cols
                          val y0 = (r * bh) / rows
                          val x1 = ((c + 1) * bw) / cols
                          val y1 = ((r + 1) * bh) / rows
                          val cx = (x0 + x1) / 2
                          val cy = (y0 + y1) / 2

                          val centerPixel = bmp.getPixel(cx.coerceIn(0, bw - 1), cy.coerceIn(0, bh - 1))
                          val leftPixel = bmp.getPixel((x0 + 2).coerceIn(0, bw - 1), cy.coerceIn(0, bh - 1))
                          val rightPixel = bmp.getPixel((x1 - 2).coerceIn(0, bw - 1), cy.coerceIn(0, bh - 1))
                          val topPixel = bmp.getPixel(cx.coerceIn(0, bw - 1), (y0 + 2).coerceIn(0, bh - 1))
                          val botPixel = bmp.getPixel(cx.coerceIn(0, bw - 1), (y1 - 2).coerceIn(0, bh - 1))

                          val diff = (colorDiff(centerPixel, leftPixel) +
                              colorDiff(centerPixel, rightPixel) +
                              colorDiff(centerPixel, topPixel) +
                              colorDiff(centerPixel, botPixel)) / 4.0

                          val hsv = FloatArray(3)
                          Color.colorToHSV(centerPixel, hsv)
                          val saturation = hsv[1]
                          val brightness = hsv[2]

                          val score = diff * (0.6 + saturation * 0.8) * (if (brightness > 0.2f) 1.0 else 0.4)
                          if (score > 28.0) {
                              val realX = ((cx.toFloat() / bw.toFloat()) * screenW).toInt()
                              val realY = ((cy.toFloat() / bh.toFloat()) * screenH).toInt()
                              val zone = when {
                                  c < 3 -> "Play-Arena-Left"
                                  c >= cols - 3 -> "Play-Arena-Right"
                                  else -> "Play-Arena-Center"
                              }
                              hotspots.add(
                                  Hotspot(
                                      screenX = realX,
                                      screenY = realY,
                                      contrastScore = score,
                                      colorLabel = classifyColor(centerPixel, hsv),
                                      zoneLabel = zone
                                  )
                              )
                          }
                      }
                  }

                  val topSpots = hotspots.sortedByDescending { it.contrastScore }.take(10)
                  val out = StringBuilder()
                  out.appendLine("=== VISUAL RADAR (PLAY ARENA COLOR REGIONS) ===")
                  if (topSpots.isEmpty()) {
                      out.appendLine("• Play arena ready. Read exact (x,y) coordinates from the yellow grid on the image.")
                  } else {
                      for (spot in topSpots) {
                          out.appendLine(
                              "• [${spot.zoneLabel}] ${spot.colorLabel} region near (${spot.screenX}, ${spot.screenY})"
                          )
                      }
                  }
                  return out.toString().trim()
              }

              private fun colorDiff(c1: Int, c2: Int): Int {
                  return abs(Color.red(c1) - Color.red(c2)) +
                      abs(Color.green(c1) - Color.green(c2)) +
                      abs(Color.blue(c1) - Color.blue(c2))
              }

              private fun classifyColor(pixel: Int, hsv: FloatArray): String {
                  val h = hsv[0]
                  val s = hsv[1]
                  val v = hsv[2]
                  if (v < 0.18f) return "Dark/Black"
                  if (s < 0.18f) return if (v > 0.82f) "Bright-White" else "Gray/Silver"
                  return when {
                      h < 20f || h >= 340f -> "Red/Crimson"
                      h < 45f -> "Orange/Bronze"
                      h < 70f -> "Yellow/Gold"
                      h < 165f -> "Green/Emerald"
                      h < 205f -> "Cyan/Ice"
                      h < 265f -> "Blue/Neon"
                      h < 340f -> "Purple/Magenta"
                      else -> "Vibrant"
                  }
              }

              private fun safeX(x: Float): Float {
                  val w = max(lastRealWidth, resources.displayMetrics.widthPixels).toFloat()
                  return x.coerceIn(15f, max(30f, w - 15f))
              }

              private fun safeY(y: Float): Float {
                  val h = max(lastRealHeight, resources.displayMetrics.heightPixels).toFloat()
                  // Protects Samsung M52 5G top punch-hole status bar (90px) and bottom 3-button navigation bar (140px)
                  return y.coerceIn(90f, max(150f, h - 140f))
              }

              fun performGameBatch(stepsJson: String): String {
                  return try {
                      val arr = JSONArray(stepsJson)
                      val results = mutableListOf<String>()
                      val count = min(arr.length(), 20)
                      for (i in 0 until count) {
                          val obj = arr.getJSONObject(i)
                          val type = obj.optString("action_type", "tap")
                          val x = obj.optDouble("x", 540.0).toFloat()
                          val y = obj.optDouble("y", 950.0).toFloat()
                          val endX = obj.optDouble("end_x", x.toDouble()).toFloat()
                          val endY = obj.optDouble("end_y", y.toDouble()).toFloat()
                          val secondX = obj.optDouble("second_x", 850.0).toFloat()
                          val secondY = obj.optDouble("second_y", 1600.0).toFloat()
                          val durationMs = obj.optLong("duration_ms", 65L)
                          val waitAfterMs = obj.optLong("wait_ms", 550L).coerceIn(150L, 3500L)

                          val ok = performGameAction(type, x, y, endX, endY, secondX, secondY, durationMs)
                          results.add("Step ${i + 1}: $type(${x.toInt()},${y.toInt()}) -> ${if (ok) "OK" else "FAIL"}")
                          if (i < count - 1) {
                              Thread.sleep(waitAfterMs)
                          }
                      }
                      "Executed ${results.size} batch game steps:\n" + results.joinToString("\n")
                  } catch (e: Exception) {
                      "Batch execution error: ${e.message}"
                  }
              }

              fun performGameAction(
                  actionType: String,
                  x: Float,
                  y: Float,
                  endX: Float,
                  endY: Float,
                  secondX: Float,
                  secondY: Float,
                  durationMs: Long
              ): Boolean {
                  val sx = safeX(x)
                  val sy = safeY(y)
                  val ex = safeX(endX)
                  val ey = safeY(endY)
                  val s2x = safeX(secondX)
                  val s2y = safeY(secondY)

                  return when (actionType.trim().lowercase()) {
                      "tap", "fast_tap" -> tapCoordinates(sx, sy, durationMs.coerceIn(40L, 250L))
                      "double_tap" -> {
                          val ok1 = tapCoordinates(sx, sy, 45L)
                          Thread.sleep(70)
                          val ok2 = tapCoordinates(sx, sy, 45L)
                          ok1 && ok2
                      }
                      "hold", "long_press" -> tapCoordinates(sx, sy, durationMs.coerceIn(400L, 8000L))
                      "joystick", "drag", "swipe" -> swipe(sx, sy, ex, ey, durationMs.coerceIn(80L, 8000L))
                      "multi_touch", "two_finger" -> {
                          val path1 = Path().apply {
                              moveTo(sx, sy)
                              if (abs(ex - sx) > 2f || abs(ey - sy) > 2f) {
                                  lineTo(ex, ey)
                              }
                          }
                          val path2 = Path().apply { moveTo(s2x, s2y) }
                          val d1 = durationMs.coerceIn(100L, 5000L)
                          val d2 = min(d1, 180L)
                          val stroke1 = GestureDescription.StrokeDescription(path1, 0L, d1)
                          val stroke2 = GestureDescription.StrokeDescription(path2, 20L, d2)
                          val gesture = GestureDescription.Builder()
                              .addStroke(stroke1)
                              .addStroke(stroke2)
                              .build()
                          dispatchGestureSync(gesture)
                      }
                      else -> tapCoordinates(sx, sy, 60L)
                  }
              }

              fun dumpUiHierarchy(maxNodes: Int = 60): String {
                  val root = rootInActiveWindow
                      ?: return "No standard XML UI tree (Fullscreen Game / Canvas active)."
                  val sb = StringBuilder()
                  var count = 0

                  fun traverse(node: AccessibilityNodeInfo?) {
                      if (node == null || count >= maxNodes) return
                      val text = node.text?.toString()?.trim().orEmpty()
                      val desc = node.contentDescription?.toString()?.trim().orEmpty()
                      val viewId = node.viewIdResourceName?.substringAfter("/") ?: ""
                      val isClickable = node.isClickable
                      val isEditable = node.isEditable
                      val isScrollable = node.isScrollable

                      if (text.isNotEmpty() || desc.isNotEmpty() || isClickable || isEditable) {
                          val rect = Rect()
                          node.getBoundsInScreen(rect)
                          if (rect.width() > 8 && rect.height() > 8) {
                              count++
                              val cx = rect.centerX()
                              val cy = rect.centerY()
                              val cls = node.className?.toString()?.substringAfterLast('.') ?: "View"
                              sb.appendLine(
                                  "[$count] $cls | text='$text' | desc='$desc' | id='$viewId' | center=($cx,$cy)"
                              )
                          }
                      }

                      for (i in 0 until node.childCount) {
                          traverse(node.getChild(i))
                      }
                  }

                  traverse(root)
                  return if (count == 0) {
                      "Canvas/Game surface active (${root.packageName}) — use the yellow (x,y) coordinate grid on the attached screenshot."
                  } else {
                      sb.toString().trim()
                  }
              }

              fun clickByText(query: String): Boolean {
                  val root = rootInActiveWindow ?: return false
                  val normalized = query.trim().lowercase()
                  val match = findNodeMatching(root) { node ->
                      val t = node.text?.toString()?.lowercase().orEmpty()
                      val d = node.contentDescription?.toString()?.lowercase().orEmpty()
                      val id = node.viewIdResourceName?.lowercase().orEmpty()
                      t.contains(normalized) || d.contains(normalized) || id.contains(normalized)
                  } ?: return false

                  var current: AccessibilityNodeInfo? = match
                  while (current != null) {
                      if (current.isClickable && current.performAction(AccessibilityNodeInfo.ACTION_CLICK)) {
                          return true
                      }
                      current = current.parent
                  }

                  val rect = Rect()
                  match.getBoundsInScreen(rect)
                  if (rect.width() > 0 && rect.height() > 0) {
                      return tapCoordinates(rect.centerX().toFloat(), rect.centerY().toFloat())
                  }
                  return false
              }

              fun inputText(text: String, targetQuery: String? = null, submit: Boolean = false): Boolean {
                  val root = rootInActiveWindow ?: return false
                  var targetNode: AccessibilityNodeInfo? = null

                  if (!targetQuery.isNullOrBlank()) {
                      val q = targetQuery.trim().lowercase()
                      targetNode = findNodeMatching(root) { node ->
                          val t = node.text?.toString()?.lowercase().orEmpty()
                          val d = node.contentDescription?.toString()?.lowercase().orEmpty()
                          val id = node.viewIdResourceName?.lowercase().orEmpty()
                          val hint = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                              node.hintText?.toString()?.lowercase().orEmpty()
                          } else ""
                          (node.isEditable || node.className?.toString()?.contains("EditText") == true) &&
                              (t.contains(q) || d.contains(q) || id.contains(q) || hint.contains(q))
                      }
                      if (targetNode == null) {
                          if (clickByText(targetQuery)) {
                              Thread.sleep(600)
                          }
                      }
                  }

                  val updatedRoot = rootInActiveWindow ?: root
                  if (targetNode == null) {
                      targetNode = updatedRoot.findFocus(AccessibilityNodeInfo.FOCUS_INPUT)
                  }
                  if (targetNode == null) {
                      targetNode = findNodeMatching(updatedRoot) { node ->
                          node.isEditable || node.className?.toString()?.contains("EditText") == true
                      }
                  }

                  val node = targetNode ?: return false
                  node.performAction(AccessibilityNodeInfo.ACTION_FOCUS)
                  node.performAction(AccessibilityNodeInfo.ACTION_CLICK)

                  val args = Bundle().apply {
                      putCharSequence(
                          AccessibilityNodeInfo.ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE,
                          text
                      )
                  }
                  val setOk = node.performAction(AccessibilityNodeInfo.ACTION_SET_TEXT, args)

                  if (submit) {
                      Thread.sleep(250)
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                          node.performAction(AccessibilityNodeInfo.AccessibilityAction.ACTION_IME_ENTER.id)
                      }
                  }
                  return setOk
              }

              fun tapCoordinates(x: Float, y: Float, durationMs: Long = 65L): Boolean {
                  val path = Path().apply { moveTo(x, y) }
                  val stroke = GestureDescription.StrokeDescription(path, 0L, durationMs)
                  val gesture = GestureDescription.Builder().addStroke(stroke).build()
                  return dispatchGestureSync(gesture)
              }

              fun swipe(
                  startX: Float,
                  startY: Float,
                  endX: Float,
                  endY: Float,
                  durationMs: Long = 300L
              ): Boolean {
                  val path = Path().apply {
                      moveTo(startX, startY)
                      lineTo(endX, endY)
                  }
                  val stroke = GestureDescription.StrokeDescription(path, 0L, durationMs.coerceIn(40L, 8000L))
                  val gesture = GestureDescription.Builder().addStroke(stroke).build()
                  return dispatchGestureSync(gesture)
              }

              fun performGlobal(actionName: String): Boolean {
                  val action = when (actionName.trim().lowercase()) {
                      "back" -> GLOBAL_ACTION_BACK
                      "home" -> GLOBAL_ACTION_HOME
                      "recents" -> GLOBAL_ACTION_RECENTS
                      "notifications" -> GLOBAL_ACTION_NOTIFICATIONS
                      "quick_settings" -> GLOBAL_ACTION_QUICK_SETTINGS
                      else -> return false
                  }
                  return performGlobalAction(action)
              }

              private fun dispatchGestureSync(gesture: GestureDescription): Boolean {
                  val latch = CountDownLatch(1)
                  var succeeded = false
                  val dispatched = dispatchGesture(
                      gesture,
                      object : GestureResultCallback() {
                          override fun onCompleted(gestureDescription: GestureDescription?) {
                              succeeded = true
                              latch.countDown()
                          }

                          override fun onCancelled(gestureDescription: GestureDescription?) {
                              succeeded = false
                              latch.countDown()
                          }
                      },
                      null
                  )
                  if (!dispatched) return false
                  latch.await(6, TimeUnit.SECONDS)
                  return succeeded
              }

              private fun findNodeMatching(
                  root: AccessibilityNodeInfo?,
                  predicate: (AccessibilityNodeInfo) -> Boolean
              ): AccessibilityNodeInfo? {
                  if (root == null) return null
                  if (predicate(root)) return root
                  for (i in 0 until root.childCount) {
                      val childMatch = findNodeMatching(root.getChild(i), predicate)
                      if (childMatch != null) return childMatch
                  }
                  return null
              }
          }
