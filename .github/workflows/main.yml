            static List<int>? _extractVisionBytes(String content) {
              final m = RegExp(r'\[SCREEN_VISION_IMAGE:([^\]]+)\]').firstMatch(content);
              if (m == null) return null;
              final path = m.group(1)?.trim();
              if (path == null || path.isEmpty) return null;
              try {
                final f = File(path);
                if (f.existsSync()) return f.readAsBytesSync();
              } catch (_) {}
              return null;
            }

            static String _stripVisionTag(String content) {
              return content.replaceAll(RegExp(r'\[SCREEN_VISION_IMAGE:[^\]]+\]'), '').trim();
            }

            /// Converts internal messages into OpenAI wire format.
            /// Attaches at most ONE image on the LAST user or tool message.
            static List<Map<String, dynamic>> convertMessages(
              List<ChatMessage> messages, {
              bool includeVision = true,
              bool appendDegradedNote = false,
            }) {
              final result = <Map<String, dynamic>>[];
              for (var i = 0; i < messages.length; i++) {
                final m = messages[i];
                final isLast = i == messages.length - 1;
                final visionBytes = (isLast && includeVision) ? _extractVisionBytes(m.content) : null;
                var textContent = _stripVisionTag(m.content);
                if (isLast && appendDegradedNote) {
                  textContent = '$textContent\n$honestDegradationNote'.trim();
                }

                switch (m.role) {
                  case MessageRole.system:
                    result.add({'role': 'system', 'content': textContent});
                  case MessageRole.user:
                    if (visionBytes != null) {
                      result.add({
                        'role': 'user',
                        'content': [
                          {'type': 'text', 'text': textContent},
                          {
                            'type': 'image_url',
                            'image_url': {
                              'url': 'data:image/jpeg;base64,${base64Encode(visionBytes)}',
                            },
                          },
                        ],
                      });
                    } else {
                      result.add({'role': 'user', 'content': textContent});
                    }
                  case MessageRole.assistant:
                    result.add({
                      'role': 'assistant',
                      'content': textContent.isEmpty ? null : textContent,
                      if (m.toolCalls.isNotEmpty)
                        'tool_calls': [
                          for (final call in m.toolCalls)
                            {
                              'id': call.id,
                              'type': 'function',
                              'function': {
                                'name': call.name,
                                'arguments': call.argumentsJson,
                              },
                            },
                        ],
                    });
                  case MessageRole.tool:
                    result.add({
                      'role': 'tool',
                      'tool_call_id': m.toolCallId,
                      if (m.toolName != null) 'name': m.toolName,
                      'content': textContent,
                    });
                    if (visionBytes != null) {
                      result.add({
                        'role': 'user',
                        'content': [
                          {'type': 'text', 'text': '[live vision: current screen frame]'},
                          {
                            'type': 'image_url',
                            'image_url': {
                              'url': 'data:image/jpeg;base64,${base64Encode(visionBytes)}',
                            },
                          },
                        ],
                      });
                    }
                }
              }
              return result;
            }

            static List<Map<String, dynamic>> convertTools(
              List<ProviderToolSpec> tools,
            ) {
              return [
                for (final tool in tools)
                  {
                    'type': 'function',
                    'function': {
                      'name': tool.name,
                      'description': tool.description,
                      'parameters': tool.parameters,
                    },
                  },
              ];
            }

            Map<String, dynamic> _buildBody(
              ChatRequest request, {
              required bool includeVision,
              required bool appendDegradedNote,
            }) {
              return <String, dynamic>{
                'model': request.model,
                'messages': convertMessages(
                  request.messages,
                  includeVision: includeVision,
                  appendDegradedNote: appendDegradedNote,
                ),
                'stream': true,
                'temperature': request.params.temperature,
                'top_p': request.params.topP,
                'max_tokens': request.params.maxTokens,
                if (type == ProviderType.openai) ...{
                  'stream_options': {'include_usage': true},
                },
                if (type.supportsPenalties) ...{
                  'frequency_penalty': request.params.frequencyPenalty,
                  'presence_penalty': request.params.presencePenalty,
                },
                if (request.tools.isNotEmpty) ...{
                  'tools': convertTools(request.tools),
                  'tool_choice': 'auto',
                },
              };
            }

            @override
            Stream<ChatStreamEvent> streamMessage(ChatRequest request) async* {
              final lastMsg = request.messages.isNotEmpty ? request.messages.last : null;
              final hasVisionImage =
                  lastMsg != null && _extractVisionBytes(lastMsg.content) != null;

              Response<ResponseBody>? response;
              try {
                final body = _buildBody(
                  request,
                  includeVision: supportsVision,
                  appendDegradedNote: hasVisionImage && !supportsVision,
                );
                if (hasVisionImage && !supportsVision) {
                  debugPrint('vision: degraded to text (endpoint rejected images)');
                }
                response = await _dio.post<ResponseBody>(
                  _chatCompletionsUrl,
                  data: jsonEncode(body),
                  options: Options(
                    headers: _headers,
                    responseType: ResponseType.stream,
                  ),
                  cancelToken: request.cancelToken,
                );
              } on DioException catch (e) {
                if (e.type == DioExceptionType.cancel) {
                  yield const StreamDoneEvent();
                  return;
                }
                final statusCode = e.response?.statusCode ?? 0;
                if (hasVisionImage && statusCode >= 400 && statusCode < 500) {
                  // Honest degradation (Rule 5a): retry the SAME request once WITHOUT images
                  debugPrint('vision: degraded to text (endpoint rejected images)');
                  try {
                    final fallbackBody = _buildBody(
                      request,
                      includeVision: false,
                      appendDegradedNote: true,
                    );
                    response = await _dio.post<ResponseBody>(
                      _chatCompletionsUrl,
                      data: jsonEncode(fallbackBody),
                      options: Options(
                        headers: _headers,
                        responseType: ResponseType.stream,
                      ),
                      cancelToken: request.cancelToken,
                    );
                  } on DioException catch (retryErr) {
                    final msg = await readDioErrorMessage(retryErr);
                    yield StreamErrorEvent(msg);
                    return;
                  }
                } else {
                  final msg = await readDioErrorMessage(e);
                  yield StreamErrorEvent(msg);
                  return;
                }
              }

              final body1 = response?.data;
              if (body1 == null) {
                yield const StreamErrorEvent('Empty response body');
                return;
              }

              final toolBuilders = <int, ToolCallFragmentBuilder>{};
              String? finishReason;

              await for (final json in parseSseJsonStream(body1.stream)) {
                final usage = json['usage'];
                if (usage is Map<String, dynamic>) {
                  yield UsageEvent(UsageInfo(
                    promptTokens: (usage['prompt_tokens'] as num?)?.toInt(),
                    completionTokens: (usage['completion_tokens'] as num?)?.toInt(),
                  ));
                }

                final choices = json['choices'];
                if (choices is! List || choices.isEmpty) continue;
                final choice = choices.first as Map<String, dynamic>;
                finishReason = choice['finish_reason'] as String? ?? finishReason;

                final delta = choice['delta'] as Map<String, dynamic>?;
                if (delta == null) continue;

                final content = delta['content'];
                if (content is String && content.isNotEmpty) {
                  yield TextDeltaEvent(content);
                }

                final toolCalls = delta['tool_calls'];
                if (toolCalls is List) {
                  for (final raw in toolCalls) {
                    final call = raw as Map<String, dynamic>;
                    final index = (call['index'] as num?)?.toInt() ?? 0;
                    final builder =
                        toolBuilders.putIfAbsent(index, ToolCallFragmentBuilder.new);
                    builder.absorb(call);
                  }
                }
              }

              if (toolBuilders.isNotEmpty || finishReason == 'tool_calls') {
                final calls = toolBuilders.entries
                    .map((e) => e.value.build(e.key))
                    .whereType<ToolCallInfo>()
                    .toList();
                if (calls.isNotEmpty) yield ToolCallsEvent(calls);
              }
              yield const StreamDoneEvent();
            }

            @override
            Future<List<String>> listModels() async {
              try {
                final response = await _dio.get<Map<String, dynamic>>(
                  _modelsUrl,
                  options: Options(headers: _headers),
                );
                final data = response.data?['data'];
                if (data is List) {
                  final models = data
                      .whereType<Map<String, dynamic>>()
                      .map((m) => m['id'])
                      .whereType<String>()
                      .toList()
                    ..sort();
                  if (models.isNotEmpty) return models;
                }
                return type.suggestedModels;
              } on DioException catch (e) {
                throw Exception(await readDioErrorMessage(e));
              }
            }
          }
