                  name: 'swipe_screen',
                  description:
                      'Swipes or scrolls the phone screen in a direction ("up", "down", "left", "right") or between custom coordinates.',
                  inputSchema: const {
                    'type': 'object',
                    'properties': {
                      'direction': {
                        'type': 'string',
                        'description':
                            'Swipe direction: "up" (scroll down), "down" (scroll up), "left", or "right".',
                      },
                      'start_x': {'type': 'number', 'description': 'Optional start X.'},
                      'start_y': {'type': 'number', 'description': 'Optional start Y.'},
                      'end_x': {'type': 'number', 'description': 'Optional end X.'},
                      'end_y': {'type': 'number', 'description': 'Optional end Y.'},
                    },
                  },
                  risk: ToolRisk.safe,
                  run: (args) async {
                    final direction = (args['direction'] as String? ?? 'up').toLowerCase();
                    double startX = (args['start_x'] as num?)?.toDouble() ?? 540;
                    double startY = (args['start_y'] as num?)?.toDouble() ?? 1600;
                    double endX = (args['end_x'] as num?)?.toDouble() ?? 540;
                    double endY = (args['end_y'] as num?)?.toDouble() ?? 400;

                    if (args['start_x'] == null && args['start_y'] == null) {
                      switch (direction) {
                        case 'down':
                          startX = 540;
                          startY = 500;
                          endX = 540;
                          endY = 1600;
                          break;
                        case 'left':
                          startX = 900;
                          startY = 1000;
                          endX = 150;
                          endY = 1000;
                          break;
                        case 'right':
                          startX = 150;
                          startY = 1000;
                          endX = 900;
                          endY = 1000;
                          break;
                        case 'up':
                        default:
                          startX = 540;
                          startY = 1600;
                          endX = 540;
                          endY = 400;
                          break;
                      }
                    }

                    try {
                      final res = await _channel.invokeMethod<String>('swipe', {
                        'startX': startX,
                        'startY': startY,
                        'endX': endX,
                        'endY': endY,
                        'durationMs': 350,
